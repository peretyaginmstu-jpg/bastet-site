# Fragment for the bastet-dez.ru server block (usually /etc/nginx/sites-available/bastet-dez.ru).
# Paste inside server { ... } - these location blocks must come before the default static handling.
# Check: sudo nginx -t, then: sudo systemctl reload nginx

# Request form - proxy to the local submit.py service.
location = /api/request {
    proxy_pass http://127.0.0.1:8751/api/request;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 64k;
}

# Service liveness probe (internal).
location = /api/healthz {
    proxy_pass http://127.0.0.1:8751/healthz;
    proxy_set_header Host $host;
}